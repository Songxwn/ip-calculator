<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP 子网计算器 · IPv4 / IPv6 Subnet Calculator</title>
<meta name="description" content="快速、美观的 IPv4 / IPv6 子网计算器：CIDR、掩码、网络地址、广播地址、可用主机、子网划分、范围转 CIDR。A fast, beautiful IPv4 / IPv6 subnet calculator.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var m = localStorage.getItem('ipc-theme') || 'auto';
      var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="bg-deco" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="./">
      <img src="favicon.svg" alt="" width="32" height="32">
      <span>
        <strong data-i18n="title">IP 子网计算器</strong>
        <small data-i18n="subtitle">IPv4 · IPv6 · CIDR</small>
      </span>
    </a>
    <div class="actions">
      <button class="icon-btn" id="langBtn" type="button" data-i18n-title="switchLang">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="langLabel">EN</span>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" data-i18n-title="switchTheme">
        <svg class="ic-auto" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        <svg class="ic-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="ic-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="themeLabel">Auto</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero card">
    <label class="input-label" for="ipInput" data-i18n="inputLabel">输入 IP 地址 / CIDR</label>
    <div class="input-wrap" id="inputWrap">
      <span class="ver-badge" id="verBadge">IP</span>
      <input id="ipInput" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             data-i18n-ph="inputPh" placeholder="192.168.1.10/24 · 10.0.0.1 255.255.0.0 · 2001:db8::1/64">
      <button class="ghost-btn" id="clearBtn" type="button" data-i18n-title="clear">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <button class="ghost-btn" id="shareBtn" type="button" data-i18n-title="share">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
    </div>
    <div class="input-msg" id="inputMsg"></div>

    <div class="prefix-row">
      <div class="prefix-ctl">
        <button class="step-btn" id="pfxDown" type="button" aria-label="-1">−</button>
        <div class="prefix-val"><span>/</span><input id="pfxNum" type="number" min="0" max="32" value="24" aria-label="prefix"></div>
        <button class="step-btn" id="pfxUp" type="button" aria-label="+1">+</button>
      </div>
      <input type="range" id="pfxRange" min="0" max="32" value="24" aria-label="prefix">
      <div class="prefix-mask mono" id="pfxMask">255.255.255.0</div>
    </div>

    <div class="chips-row">
      <span class="chips-title" data-i18n="examples">示例</span>
      <div class="chips" id="examples"></div>
    </div>
    <div class="chips-row" id="historyRow" hidden>
      <span class="chips-title" data-i18n="history">最近</span>
      <div class="chips" id="history"></div>
      <button class="link-btn" id="clearHistory" type="button" data-i18n="clearHistory">清除</button>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="calc" type="button" data-i18n="tabCalc">计算结果</button>
    <button class="tab" data-tab="split" type="button" data-i18n="tabSplit">子网划分</button>
    <button class="tab" data-tab="range" type="button" data-i18n="tabRange">范围 → CIDR</button>
    <button class="tab" data-tab="cheat" type="button" data-i18n="tabCheat">速查表</button>
  </nav>

  <section class="panel active" id="panel-calc"></section>
  <section class="panel" id="panel-split"></section>

  <section class="panel" id="panel-range">
    <div class="card">
      <h3 data-i18n="rangeTitle">IP 范围转换为 CIDR</h3>
      <p class="muted" data-i18n="rangeDesc">输入起始与结束地址，计算覆盖该范围的最少 CIDR 块。</p>
      <div class="range-form">
        <input id="rangeStart" class="field mono" type="text" spellcheck="false" autocomplete="off" placeholder="192.168.0.10">
        <span class="range-arrow">→</span>
        <input id="rangeEnd" class="field mono" type="text" spellcheck="false" autocomplete="off" placeholder="192.168.3.200">
      </div>
      <div id="rangeOut"></div>
    </div>
  </section>

  <section class="panel" id="panel-cheat"></section>
</main>

<footer class="wrap footer">
  <span data-i18n="footer">纯静态 · 所有计算均在浏览器本地完成，不上传任何数据</span>
  <span class="kbd-hint"><kbd>/</kbd> <span data-i18n="kbdFocus">聚焦输入</span> · <kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="kbdPrefix">调整前缀</span></span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
